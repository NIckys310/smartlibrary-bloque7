<path d="M40,558 L508,558 L520,570 L520,617 L40,617 Z" fill="#FFFFFF" stroke="#7F7F7F"/>
<path d="M508,558 L508,570 L520,570" fill="none" stroke="#7F7F7F"/>
<text x="50" y="577" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">(1) GestorPrestamos tiene baja cohesión: guarda las colecciones (datos),</text>
<text x="50" y="592" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">registra préstamos (negocio) y nadie recibe la petición HTTP (presentación).</text>
<text x="50" y="607" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">Se reparte en PrestamoController, PrestamoService y los Repository.</text>
<path d="M40,633 L472,633 L484,645 L484,677 L40,677 Z" fill="#FFFFFF" stroke="#7F7F7F"/>
<path d="M472,633 L472,645 L484,645" fill="none" stroke="#7F7F7F"/>
<text x="50" y="652" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">(2) Las List&lt;&gt; en memoria no persisten: se reemplazan por</text>
<text x="50" y="667" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">EstudianteRepository, LibroRepository y PrestamoRepository (JPA + H2).</text>
<path d="M550,558 L928,558 L940,570 L940,617 L550,617 Z" fill="#FFFFFF" stroke="#7F7F7F"/>
<path d="M928,558 L928,570 L940,570" fill="none" stroke="#7F7F7F"/>
<text x="560" y="577" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">(3) registrarPrestamo no declara qué pasa si el libro no está</text>
<text x="560" y="592" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">disponible (R1) ni si el estudiante/libro no existe (R4):</text>
<text x="560" y="607" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">faltan excepciones que se traduzcan a 409 y 404.</text>
<path d="M550,633 L940,633 L952,645 L952,692 L550,692 Z" fill="#FFFFFF" stroke="#7F7F7F"/>
<path d="M940,633 L940,645 L952,645" fill="none" stroke="#7F7F7F"/>
<text x="560" y="652" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">(4) Libro–Prestamo y Estudiante–Prestamo son asociaciones, no</text>
<text x="560" y="667" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">composiciones: el libro y el estudiante existen antes y después</text>
<text x="560" y="682" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">del préstamo; borrar un préstamo no los borra.</text>
<path d="M970,558 L1282,558 L1294,570 L1294,632 L970,632 Z" fill="#FFFFFF" stroke="#7F7F7F"/>
<path d="M1282,558 L1282,570 L1294,570" fill="none" stroke="#7F7F7F"/>
<text x="980" y="577" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">(5) Falta saber si un préstamo está activo</text>
<text x="980" y="592" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">(R5): se añade estaActivo() = fechaDevolucion</text>
<text x="980" y="607" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">es null. setId() público rompe el encapsulamiento:</text>
<text x="980" y="622" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#333">el id lo genera la base de datos.</text>
