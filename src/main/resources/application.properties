spring.application.name=smartlibrary

# Base de datos H2 en memoria (consola en http://localhost:8080/h2-console)
spring.datasource.url=jdbc:h2:mem:smartlibrary;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Hibernate crea las tablas y después se cargan los datos de data.sql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
